defaults:
  - _self_
  - dataset: fiqa
  - retriever: tf_idf
  - model: encoder

action: evaluate
device: cpu
base_path: "."
output_dir: outputs/retrieval
seed: 42
split: dev
batch_size: 128
cutoffs: [1, 5, 10, 20]
training:
  seed: null
  epochs: 4
  batch_size: 64
  learning_rate: 0.0003

hydra:
  run:
    dir: ${output_dir}/${dataset.name}/${retriever.method}/hydra
  sweep:
    dir: ${output_dir}/hydra/${split}/${now:%Y-%m-%d_%H-%M-%S}
